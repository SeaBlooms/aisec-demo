[project]
name = "aisec-demo"
version = "0.1.0"
description = "Default-deny runtime control for AI agents: live panel demo"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "fastmcp>=4.1.4",
    "httpx>=0.28.1",
    "pydantic-ai-slim[anthropic,mcp]>=2.61.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
demo = "demo.launcher:main"
demo-preflight = "demo.launcher:preflight_main"
demo-smoke = "demo.smoke:main"
demo-reliability = "demo.reliability:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["demo"]

[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
